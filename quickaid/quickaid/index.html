    <script>
        // JavaScript to Fetch User's Location
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    document.getElementById("user-location").innerText = `📍 Lat: ${lat}, Lon: ${lon}`;
                },
                () => {
                    document.getElementById("user-location").innerText = "📍 Location access denied";
                }
            );
        } else {
            document.getElementById("user-location").innerText = "📍 Location not supported";
        }
    </script>
